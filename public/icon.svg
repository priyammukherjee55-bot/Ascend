<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="ascend-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="512" height="512" rx="128" fill="#09090b"/>
  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="210" stroke="url(#ascend-grad)" stroke-width="16" opacity="0.4"/>
  <!-- Glowing Hexagonal Shield / Trophy Emblem -->
  <path d="M256 70 L390 148 V292 C390 376 332 444 256 466 C180 444 122 376 122 292 V148 Z" 
        fill="url(#ascend-grad)" filter="url(#glow)" opacity="0.9"/>
  <!-- Inner White Sport Crest / Trophy Star -->
  <path d="M256 140 L280 214 H358 L295 260 L319 334 L256 288 L193 334 L217 260 L154 214 H232 Z" 
        fill="#ffffff"/>
  <!-- Cricket Seam & Football Accent arc -->
  <path d="M190 350 C 220 380, 292 380, 322 350" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
</svg>
